[project]
name = "vox"
version = "0.1.0"
description = "Audio cleanup and voice cloning pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "pytest>=9.1.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[tool.uv.build-backend]
module-name = "audio_pipeline"
